# The same InsightFace models as dev_noncommercial.ini (NON-COMMERCIAL research licence),
# but run with ONNX Runtime instead of ncnn. Used by tools/bench to compare the two
# runtimes on identical networks.

detector.type    = scrfd
detector.backend = onnx
detector.model   = models/dev_noncommercial/scrfd_det_500m.onnx
detector.score   = 0.5

detector.haar_face = models/permissive/haar_frontalface.xml
detector.haar_eye  = models/permissive/haar_eye.xml

# YuNet measures the head pose, as in dev_noncommercial.ini (see the comment there).
pose.detector_profile = models/permissive.ini

recognizer.type      = arcface
recognizer.backend   = onnx
recognizer.model     = models/dev_noncommercial/arcface_w600k_mbf.onnx
recognizer.dim       = 512
recognizer.threshold = 0.40

runtime.threads = 2
