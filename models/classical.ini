# Classical profile: NO neural networks.
#   detector   Haar cascade (Viola-Jones) + eye cascade
#   recognizer LBP texture histograms reduced to 256 numbers
# Needs no model licence beyond the OpenCV cascade files (Intel BSD-style licence).
# Much less accurate than the deep profiles; it exists as the classical alternative.

detector.type      = haar
detector.haar_face = models/permissive/haar_frontalface.xml
detector.haar_eye  = models/permissive/haar_eye.xml

recognizer.type      = lbp
recognizer.dim       = 256
# placeholder; calibrated by tools/eval_features (see docs/RESULTS.md)
recognizer.threshold = 0.50

runtime.threads = 2
