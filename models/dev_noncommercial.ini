# DEVELOPMENT profile: InsightFace "buffalo_sc" models, run with ncnn.
# These models are licensed for NON-COMMERCIAL RESEARCH use only (see docs/MODELS.md).
# Do not ship a product with them: switch to a permissively licensed profile first.
#   SCRFD det_500m  face detector with 5 landmarks (any input size that is a multiple of 32: a 640x384 rectangle for a
#                   16:9 picture, see detector.layout below; dev_noncommercial_square.ini keeps the 640x640 square)
#   ArcFace w600k_mbf  face recognizer, 512-dimensional feature

detector.type    = scrfd
detector.backend = ncnn
detector.model   = models/dev_noncommercial/det_dyn.param
detector.input   = in0
# Nine raw outputs (the last convolutions of the strides 8, 16, 32: scores, boxes, landmarks) instead of the nine
# reshaped ones (out0..out8) of the square variant. det_dyn.param is det.param with the two fixed-size upsampling layers
# changed to "twice as large", so SCRFD accepts any size that is a multiple of 32 and runs on a 640x384 rectangle for a
# 16:9 picture instead of the 640x640 square (same scale, same result, about 40% less work).
detector.outputs = 65,85,105,66,86,106,67,87,107
detector.layout  = chw
detector.score   = 0.5

detector.haar_face = models/permissive/haar_frontalface.xml
detector.haar_eye  = models/permissive/haar_eye.xml

# The head-pose check (the "second look" at a face, which measures pitch / yaw / roll from the 5
# landmarks) is done by the detector of THIS other profile: YuNet (MIT licence). SCRFD's
# landmarks give a pitch about 2.5 times noisier than YuNet's, so with SCRFD only 28% of
# straight-on portraits passed the +-5 degree gate (YuNet: 57%). SCRFD still finds the faces.
# Remove this line to let SCRFD measure the pose as well (and re-check docs/RESULTS.md section 4).
pose.detector_profile = models/permissive.ini

recognizer.type      = arcface
recognizer.backend   = ncnn
recognizer.model     = models/dev_noncommercial/rec.param
recognizer.input     = in0
recognizer.output    = out0
recognizer.dim       = 512
# Cosine-similarity threshold. On 153 people (tools/eval_features) different people scored
# at most 0.30 and the same person on two photos at least 0.60, so 0.40 sits in the gap
# with no false accept and no false reject. Re-check on your own camera images.
recognizer.threshold = 0.40

runtime.threads = 2
