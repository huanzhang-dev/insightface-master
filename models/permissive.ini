# Permissive profile: models with MIT / Apache-2.0 licences (see docs/MODELS.md).
#   YuNet (MIT)    face detector with 5 landmarks, from the OpenCV model zoo
#   SFace (Apache) face recognizer, 128-dimensional feature
# Relative paths start at the project root.

detector.type    = yunet
detector.backend = onnx
detector.model   = models/permissive/yunet.onnx
detector.score   = 0.6
# Faster 320x320 version of the same network, used when the camera image is at most
# 640 pixels on its longer side (made from yunet.onnx by changing the input size; the
# network is fully convolutional). Faces below ~40 px are less reliably found with it.
detector.model_small = models/permissive/yunet_320.onnx
detector.small_size  = 320
detector.small_max_side = 640

# Classical (non-deep) detector: Haar cascades from OpenCV (Intel BSD-style licence).
detector.haar_face = models/permissive/haar_frontalface.xml
detector.haar_eye  = models/permissive/haar_eye.xml

recognizer.type      = sface
recognizer.backend   = onnx
recognizer.model     = models/permissive/sface.onnx
recognizer.dim       = 128
# Cosine-similarity threshold. The SFace authors recommend 0.363, which is fine for
# comparing two photos but far too low for searching among many registered people
# (tools/eval_features: 27% of strangers accepted among 152 people). On 153 portraits the
# highest score of two DIFFERENT people was 0.498 (two look-alikes) and the lowest score of
# two photos of the SAME person was 0.654, so 0.55 sits between them with a margin on both
# sides (0.50 was only 0.002 above the worst stranger pair). Same-person scores on a real
# camera will be lower than for these studio portraits: calibrate again on your own camera
# images (docs/RESULTS.md).
recognizer.threshold = 0.55

runtime.threads = 2
